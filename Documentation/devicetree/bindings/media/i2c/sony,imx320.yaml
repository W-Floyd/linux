%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx320.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX320 Sensor

maintainers:
  - William Floyd <git@notmy.space>

description:
  IMX320 is a Sony CMOS active pixel digital image sensor with an 8 Mpixel
  active array, used as a front-facing camera in mobile devices. It is
  programmable over I2C and sends image data over MIPI CSI-2 D-PHY on two
  data lanes.

properties:
  compatible:
    const: sony,imx320

  reg:
    description: I2C address
    maxItems: 1

  clocks:
    description: Input clock, 24MHz
    maxItems: 1

  vana-supply:
    description: Analog power supply (2.8V).

  vio-supply:
    description: Interface power supply (1.8V).

  vcore-supply:
    description: Digital core power supply (1.05V).

  reset-gpios:
    description: Reference to the GPIO connected to the XCLR pin, if any.
    maxItems: 1

  orientation: true

  rotation: true

  port:
    additionalProperties: false
    $ref: /schemas/graph.yaml#/$defs/port-base

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            maxItems: 2
          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "sony,imx320";
            reg = <0x10>;

            clocks = <&cam_clk>;

            vana-supply = <&cam_vana>;
            vio-supply = <&cam_vio>;
            vcore-supply = <&cam_vcore>;

            reset-gpios = <&tlmm 12 GPIO_ACTIVE_LOW>;

            orientation = <0>;
            rotation = <270>;

            port {
                endpoint {
                    remote-endpoint = <&csiphy2_ep>;
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <172500000 681000000
                                                  738000000>;
                };
            };
        };
    };

...
