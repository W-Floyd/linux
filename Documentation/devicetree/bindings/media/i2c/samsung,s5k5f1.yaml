%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k5f1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K5F1 Sensor

maintainers:
  - William Floyd <git@notmy.space>

description:
  S5K5F1 is a Samsung monochrome CMOS image sensor with a 2400x2400 active
  array, sensitive into the near infrared and used as an iris-recognition
  camera in mobile devices. It is programmable over I2C and sends 8-bit
  greyscale image data over MIPI CSI-2 D-PHY on two data lanes. The
  infrared illuminator it is paired with is a separate device.

properties:
  compatible:
    const: samsung,s5k5f1

  reg:
    maxItems: 1

  clocks:
    description: Input clock, 24MHz
    maxItems: 1

  vio-supply:
    description: Interface power supply (1.8V).

  vdig-supply:
    description: Digital core power supply (1.05V).

  vana-supply:
    description: Analog power supply (2.8V).

  reset-gpios:
    description: Reference to the GPIO connected to the XCLR pin, if any.
    maxItems: 1

  orientation: true

  rotation: true

  port:
    additionalProperties: false
    $ref: /schemas/graph.yaml#/$defs/port-base

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            maxItems: 2
          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "samsung,s5k5f1";
            reg = <0x10>;

            clocks = <&cam_clk>;

            vio-supply = <&cam_vio>;
            vdig-supply = <&cam_vdig>;
            vana-supply = <&cam_vana>;

            reset-gpios = <&tlmm 44 GPIO_ACTIVE_LOW>;

            orientation = <0>;
            rotation = <90>;

            port {
                endpoint {
                    remote-endpoint = <&csiphy3_ep>;
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <768000000>;
                };
            };
        };
    };

...
