%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/techwell,tw9990.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Techwell TW9990 NTSC/PAL/SECAM video decoder

maintainers:
  - William Floyd <git@notmy.space>

description:
  Automotive analog video decoder (now Renesas) with single-ended or
  differential CVBS and S-Video inputs and an 8-bit BT.601/BT.656 output of
  interlaced fields.

properties:
  compatible:
    const: techwell,tw9990

  reg:
    description: 0x44, or 0x45 when the SIAD0 strap on VD0 is pulled high.
    enum: [0x44, 0x45]

  reset-gpios:
    description: RSTB, active low.
    maxItems: 1

  powerdown-gpios:
    description: PDN, active high.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Video output.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        video-decoder@44 {
            compatible = "techwell,tw9990";
            reg = <0x44>;
            reset-gpios = <&pinctrl 30 GPIO_ACTIVE_LOW>;

            port {
                tw9990_out: endpoint {
                    remote-endpoint = <&rearview_in>;
                };
            };
        };
    };
