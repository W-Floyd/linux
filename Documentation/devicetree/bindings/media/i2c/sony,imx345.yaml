%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx345.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX345 Sensor

maintainers:
  - William Floyd <git@notmy.space>

description:
  IMX345 is a Sony CMOS active pixel digital image sensor with a 12 Mpixel
  active array, used as a rear-facing camera in mobile devices. It is
  programmable over I2C and sends image data over MIPI CSI-2 D-PHY on four
  data lanes.

  Besides the usual analog, interface and digital core rails the sensor needs
  three further supplies, without which it does not respond to I2C at all.
  What they feed is undocumented; the names mirror those the vendor firmware
  uses. The module carries three more rails again, but those belong to the OIS
  and the actuator rather than to the sensor.

properties:
  compatible:
    const: sony,imx345

  reg:
    description: I2C address
    maxItems: 1

  clocks:
    description: Input clock, 24MHz
    maxItems: 1

  vana-supply:
    description: Analog power supply (3.2V).

  vio-supply:
    description: Interface power supply (1.8V).

  vdig-supply:
    description: Digital core power supply (1.0V).

  vcustom1-supply:
    description: Additional module supply (2.85V).

  vcustom2-supply:
    description: Additional module supply (1.1V).

  vcustom10-supply:
    description: Additional module supply (1.1V).

  reset-gpios:
    description: Reference to the GPIO connected to the XCLR pin, if any.
    maxItems: 1

  orientation: true

  rotation: true

  port:
    additionalProperties: false
    $ref: /schemas/graph.yaml#/$defs/port-base

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            maxItems: 4
          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@1a {
            compatible = "sony,imx345";
            reg = <0x1a>;

            clocks = <&cam_clk>;

            vio-supply = <&cam_vio>;
            vdig-supply = <&cam_vdig>;
            vcustom1-supply = <&cam_v_custom1>;
            vcustom2-supply = <&cam_v_custom2>;
            vana-supply = <&cam_vana>;
            vcustom10-supply = <&cam_v_custom10>;

            reset-gpios = <&tlmm 25 GPIO_ACTIVE_LOW>;

            orientation = <1>;
            rotation = <90>;

            port {
                endpoint {
                    remote-endpoint = <&csiphy0_ep>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <675000000 702000000>;
                };
            };
        };
    };

...
