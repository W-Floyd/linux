%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,sm6225-camss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM6225 Camera Subsystem (CAMSS)

maintainers:
  - Loic Poulain <loic.poulain@oss.qualcomm.com>

description:
  The CAMSS IP is a CSI decoder and ISP present on Qualcomm platforms.

  SM6225 carries the same TFE-based CSID and VFE as QCM2290, widened to three
  pipes, in front of a CSIPHY of the revision SM8250 uses -- which is laid out
  on a 0x2000 register stride rather than QCM2290's 0x1000. It has no test
  pattern generator block.

properties:
  compatible:
    const: qcom,sm6225-camss

  reg:
    maxItems: 10

  reg-names:
    items:
      - const: top
      - const: csid0
      - const: csid1
      - const: csid2
      - const: csiphy0
      - const: csiphy1
      - const: csiphy2
      - const: vfe0
      - const: vfe1
      - const: vfe2

  clocks:
    maxItems: 20

  clock-names:
    items:
      - const: ahb
      - const: axi
      - const: camnoc_nrt_axi
      - const: camnoc_rt_axi
      - const: csi0
      - const: csi1
      - const: csi2
      - const: csiphy0
      - const: csiphy0_timer
      - const: csiphy1
      - const: csiphy1_timer
      - const: csiphy2
      - const: csiphy2_timer
      - const: top_ahb
      - const: vfe0
      - const: vfe0_cphy_rx
      - const: vfe1
      - const: vfe1_cphy_rx
      - const: vfe2
      - const: vfe2_cphy_rx

  interrupts:
    maxItems: 9

  interrupt-names:
    items:
      - const: csid0
      - const: csid1
      - const: csid2
      - const: csiphy0
      - const: csiphy1
      - const: csiphy2
      - const: vfe0
      - const: vfe1
      - const: vfe2

  interconnects:
    maxItems: 3

  interconnect-names:
    items:
      - const: ahb
      - const: hf_mnoc
      - const: sf_mnoc

  iommus:
    oneOf:
      - items:
          - description: S1 HLOS VFE non-protected (VFE only)
      - items:
          - description: S1 HLOS VFE non-protected
          - description: S1 HLOS CDM non-protected
          - description: S1 HLOS OPE read non-protected
          - description: S1 HLOS OPE write non-protected

  power-domains:
    items:
      - description: GDSC CAMSS Block, Global Distributed Switch Controller.

  vdd-csiphy-0p9-supply:
    description:
      Phandle to a 0.9V regulator supply to CSI PHYs.

  vdd-csiphy-1p2-supply:
    description:
      Phandle to a 1.2V regulator supply to CSI PHYs.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    description:
      CSI input ports.

    patternProperties:
      "^port@[0-3]+$":
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false

        description:
          Input port for receiving CSI data from a CSIPHY.

        properties:
          endpoint:
            $ref: video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                minItems: 1
                maxItems: 4

            required:
              - data-lanes

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - interrupts
  - interrupt-names
  - interconnects
  - interconnect-names
  - iommus
  - power-domains
  - vdd-csiphy-0p9-supply
  - vdd-csiphy-1p2-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-sm6225.h>
    #include <dt-bindings/interconnect/qcom,rpm-icc.h>
    #include <dt-bindings/interconnect/qcom,sm6115.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        camss: camss@5c11000 {
            compatible = "qcom,sm6225-camss";

            reg = <0x0 0x5c11000 0x0 0x1000>,
                  <0x0 0x5c6e000 0x0 0x1000>,
                  <0x0 0x5c75000 0x0 0x1000>,
                  <0x0 0x5c7c000 0x0 0x1000>,
                  <0x0 0x5c52000 0x0 0x2000>,
                  <0x0 0x5c54000 0x0 0x2000>,
                  <0x0 0x5c56000 0x0 0x2000>,
                  <0x0 0x5c6f000 0x0 0x4000>,
                  <0x0 0x5c76000 0x0 0x4000>,
                  <0x0 0x5c7d000 0x0 0x4000>;
            reg-names = "top",
                        "csid0",
                        "csid1",
                        "csid2",
                        "csiphy0",
                        "csiphy1",
                        "csiphy2",
                        "vfe0",
                        "vfe1",
                        "vfe2";

            clocks = <&gcc GCC_CAMERA_AHB_CLK>,
                     <&gcc GCC_CAMSS_AXI_CLK>,
                     <&gcc GCC_CAMSS_NRT_AXI_CLK>,
                     <&gcc GCC_CAMSS_RT_AXI_CLK>,
                     <&gcc GCC_CAMSS_TFE_0_CSID_CLK>,
                     <&gcc GCC_CAMSS_TFE_1_CSID_CLK>,
                     <&gcc GCC_CAMSS_TFE_2_CSID_CLK>,
                     <&gcc GCC_CAMSS_CPHY_0_CLK>,
                     <&gcc GCC_CAMSS_CSI0PHYTIMER_CLK>,
                     <&gcc GCC_CAMSS_CPHY_1_CLK>,
                     <&gcc GCC_CAMSS_CSI1PHYTIMER_CLK>,
                     <&gcc GCC_CAMSS_CPHY_2_CLK>,
                     <&gcc GCC_CAMSS_CSI2PHYTIMER_CLK>,
                     <&gcc GCC_CAMSS_TOP_AHB_CLK>,
                     <&gcc GCC_CAMSS_TFE_0_CLK>,
                     <&gcc GCC_CAMSS_TFE_0_CPHY_RX_CLK>,
                     <&gcc GCC_CAMSS_TFE_1_CLK>,
                     <&gcc GCC_CAMSS_TFE_1_CPHY_RX_CLK>,
                     <&gcc GCC_CAMSS_TFE_2_CLK>,
                     <&gcc GCC_CAMSS_TFE_2_CPHY_RX_CLK>;
            clock-names = "ahb",
                          "axi",
                          "camnoc_nrt_axi",
                          "camnoc_rt_axi",
                          "csi0",
                          "csi1",
                          "csi2",
                          "csiphy0",
                          "csiphy0_timer",
                          "csiphy1",
                          "csiphy1_timer",
                          "csiphy2",
                          "csiphy2_timer",
                          "top_ahb",
                          "vfe0",
                          "vfe0_cphy_rx",
                          "vfe1",
                          "vfe1_cphy_rx",
                          "vfe2",
                          "vfe2_cphy_rx";

            interrupts = <GIC_SPI 210 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 212 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 77 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 72 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 73 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 74 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 211 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 213 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 78 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "csid0",
                              "csid1",
                              "csid2",
                              "csiphy0",
                              "csiphy1",
                              "csiphy2",
                              "vfe0",
                              "vfe1",
                              "vfe2";

            interconnects = <&bimc MASTER_AMPSS_M0 RPM_ACTIVE_TAG
                             &config_noc SLAVE_CAMERA_CFG RPM_ACTIVE_TAG>,
                            <&mmrt_virt MASTER_CAMNOC_HF RPM_ALWAYS_TAG
                             &bimc SLAVE_EBI_CH0 RPM_ALWAYS_TAG>,
                            <&mmnrt_virt MASTER_CAMNOC_SF RPM_ALWAYS_TAG
                             &bimc SLAVE_EBI_CH0 RPM_ALWAYS_TAG>;
            interconnect-names = "ahb",
                                 "hf_mnoc",
                                 "sf_mnoc";

            iommus = <&apps_smmu 0x400 0x0>,
                     <&apps_smmu 0x800 0x0>,
                     <&apps_smmu 0x820 0x0>,
                     <&apps_smmu 0x840 0x0>;

            power-domains = <&gcc GCC_CAMSS_TOP_GDSC>;

            vdd-csiphy-0p9-supply = <&vreg_l4a>;
            vdd-csiphy-1p2-supply = <&vreg_l18a>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;
            };
        };
    };
