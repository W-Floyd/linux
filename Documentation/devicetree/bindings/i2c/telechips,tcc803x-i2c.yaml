%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/telechips,tcc803x-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x I2C master

maintainers:
  - William Floyd <git@notmy.space>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: telechips,tcc803x-i2c

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    i2c@16310000 {
        compatible = "telechips,tcc803x-i2c";
        reg = <0x16310000 0x1c>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
