%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/telechips,tcc803x-sipclk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x audio clocks behind the secure monitor

maintainers:
  - William Floyd <git@notmy.space>

description: |
  The audio peripheral clocks (MDAI, MFLT, SRCH, MSPDIF), the I/O-bus
  gates of the audio blocks (ADMA, DAI, SPDIF) and the video-bus gates of the
  CODA codec. On the Cortex-A53 the vendor kernel reaches them only through
  SiP SMC calls; the node has no registers.
  Indices: include/dt-bindings/clock/telechips,tcc803x-clks.h
  (TCC803X_SIPCLK_*).

properties:
  compatible:
    const: telechips,tcc803x-sipclk

  '#clock-cells':
    const: 1

  telechips,read-only:
    type: boolean
    description:
      Enable, disable and set-rate do nothing; only the state queries reach
      the monitor. Leaves the clock tree as the previous kernel left it. Not
      for the video-bus gates, which a codec needs enabled for real.

required:
  - compatible
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller {
        compatible = "telechips,tcc803x-sipclk";
        #clock-cells = <1>;
        telechips,read-only;
    };
