%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/telechips,tcc803x-audio-chmux.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x audio channel mux

maintainers:
  - William Floyd <git@notmy.space>

description: |
  The IOBUS configuration registers that route each DAI and SPDIF block to
  a pad port (vendor sound/soc/tcc_tcc803x/tcc_audio_chmux.[ch]). Written by
  the I2S driver through a syscon regmap.

select:
  properties:
    compatible:
      contains:
        const: telechips,tcc803x-audio-chmux
  required:
    - compatible

properties:
  compatible:
    items:
      - const: telechips,tcc803x-audio-chmux
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@16051000 {
        compatible = "telechips,tcc803x-audio-chmux", "syscon";
        reg = <0x16051000 0x98>;
    };
