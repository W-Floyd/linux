%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/telechips,tcc803x-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x I2S transmitter with its ADMA

maintainers:
  - William Floyd <git@notmy.space>

description: |
  One audio block of the TCC803x: a DAI (I2S) and the ADMA that feeds it.
  Stereo playback, S16_LE, the SoC providing bit and frame clocks.
  Registers and sequence are from the vendor kernel's
  sound/soc/tcc_tcc803x/ (tcc_i2s.c, tcc_adma_pcm.c).

properties:
  compatible:
    const: telechips,tcc803x-i2s

  reg:
    items:
      - description: ADMA registers
      - description: DAI registers (ADMA base + 0x1000)

  reg-names:
    items:
      - const: adma
      - const: dai

  interrupts:
    maxItems: 1
    description: The ADMA interrupt

  clocks:
    maxItems: 4

  clock-names:
    items:
      - const: pclk
      - const: hclk
      - const: filter
      - const: adma

  telechips,chmux:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: audio channel mux
          - description: DAI index (0-2 are 7.1ch blocks, 3-6 stereo)
          - description: pad port the block drives
    description: Which pad port this DAI is routed to.

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - telechips,chmux
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/telechips,tcc803x-clks.h>

    i2s@16201000 {
        compatible = "telechips,tcc803x-i2s";
        reg = <0x16200000 0x200>, <0x16201000 0x58>;
        reg-names = "adma", "dai";
        interrupts = <GIC_SPI 82 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&sipclk TCC803X_SIPCLK_PERI_SRCH0_CORE>,
                 <&sipclk TCC803X_SIPCLK_IOBUS_SR_DAI0>,
                 <&sipclk TCC803X_SIPCLK_PERI_SRCH0_FILTER>,
                 <&sipclk TCC803X_SIPCLK_IOBUS_SR_ADMA0>;
        clock-names = "pclk", "hclk", "filter", "adma";
        telechips,chmux = <&audio_chmux 3 4>;
        #sound-dai-cells = <0>;
    };
