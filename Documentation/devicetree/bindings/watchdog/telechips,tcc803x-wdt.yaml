%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/telechips,tcc803x-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x PMU watchdog

maintainers:
  - William Floyd <git@notmy.space>

description: |
  The PMU watchdog belongs to the secure monitor: it is set up, started,
  stopped and pinged with SiP calls (SIP_DEV_WATCHDOG, 0x82002000 + n), not
  register writes. The vendor firmware starts it before the kernel runs, and a
  kernel that does not ping it is reset by the PMU, which also clears RAM. The
  node's reg is the timer watchdog's config, clear and count registers, which
  the driver switches off.

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: telechips,tcc803x-wdt

  reg:
    maxItems: 1

  clock-frequency:
    description:
      The PMU clock in Hz that the SETUP call's timeout is counted in.

  telechips,clear-bit:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      The bit of the PING call's clear argument that clears the watchdog.
    maximum: 31
    default: 0

required:
  - compatible
  - reg
  - clock-frequency

unevaluatedProperties: false

examples:
  - |
    watchdog@14300070 {
        compatible = "telechips,tcc803x-wdt";
        reg = <0x14300070 0xc>;
        clock-frequency = <24000000>;
        telechips,clear-bit = <0>;
    };
