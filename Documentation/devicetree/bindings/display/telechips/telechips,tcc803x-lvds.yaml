%YAML 1.2
---
$id: http://devicetree.org/schemas/display/telechips/telechips,tcc803x-lvds.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x on-die LVDS PHY/serializer

maintainers:
  - William Floyd <git@notmy.space>

description: |
  The TCC803x on-die LVDS transmitter (PHY + serializer), distinct from
  the VIOC MISCCFG MRGB mux in telechips,tcc803x-mrgb-panel.yaml.

  reg and the PERI_LVDS_PHY clock (ID 105) are from the vendor kernel
  (AVNT5W_TCC803XKK_kernel tcc803x.dtsi, lvds_phy@12370000, GPLv2). The
  vendor LK bootloader (platform/tcc803x/vioc/lvds_phy.c, GPLv2) names the
  regions: on system_rev == 0 its PHY ports are HwVIOC_BASE + 0x370000 /
  0x360000 + (port << 10), i.e. single port S0 = 0x12370000, S1 =
  0x12370400 (unused by the vendor), dual ports D0 = 0x12360800 and D1 =
  0x12360c00. On system_rev != 0 it uses 0x1b941000 / 0x1b942800 /
  0x1b942c00 instead, plus an LVDS wrapper at 0x1b940000 this binding does
  not describe.

  Unresolved: a live read on a displaying unit found all 4 regions reading
  0x00000000, while the vendor init leaves RESETB (offset 0) at 0x1fff.
  Three explanations, not distinguished yet: this unit is a system_rev != 0
  part and the PHY lives at the 0x1b94xxxx addresses instead; the read was
  wrong; or this product's actual display path doesn't use this PHY at all
  (one vendor LK build target for this product compiles an HDMI->ADV7613
  path instead and excludes the LVDS panel code entirely, which would leave
  RESETB at its unprogrammed reset value of 0 for an unrelated reason). A
  live clock-gate read on this unit found the LVDS PHY's own clock enabled,
  which argues against the third explanation but doesn't rule it out (a
  gate can be left on for other reasons). system_rev is read with the
  read-only SMC SIP_CHIP_REV (SIP_CMD(7,0) = 0x82007000); source alone
  can't give its value on this unit -- check cat /proc/chipinfo or the
  stock boot log. Check before setting telechips,phy-init.

  The telechips,phy-init properties below drive the vendor's init sequence.
  Without telechips,phy-init the PHY is left as the bootloader set it.

properties:
  compatible:
    const: telechips,tcc803x-lvds

  reg:
    items:
      - description: LVDS PHY/serializer region 0 (0x12370000)
      - description: LVDS PHY/serializer region 1 (0x12370400)
      - description: LVDS config region 0 (0x12360800)
      - description: LVDS config region 1 (0x12360c00)

  reg-names:
    items:
      - const: lvds0
      - const: lvds1
      - const: lvds-cfg0
      - const: lvds-cfg1

  clocks:
    maxItems: 1
    description: PERI_LVDS_PHY (CKC_PCLKCTRL channel 105)

  clock-names:
    items:
      - const: lvds-phy

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description:
      Input endpoint, paired with the upstream CRTC's own output
      endpoint the same way hdmi_tx's "port" is in tcc803x.dtsi --
      devm_drm_of_get_bridge(dev, dev->of_node, 0, 0) on the CRTC side
      resolves exactly one such endpoint. hdmi_tx and this node cannot
      both be the live target of that single endpoint at once; which
      one is wired is a board-DT-time choice (see tcc803x-avn.dts).

  telechips,phy-init:
    type: boolean
    description:
      Program the PHY on enable instead of keeping the bootloader's setup.

  telechips,vcm-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Panel's typical LVDS common-mode voltage. Panel-specific, no default.
    minimum: 0
    maximum: 2000

  telechips,vsw-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Panel's typical LVDS differential swing. Panel-specific, no default.
    minimum: 0
    maximum: 1000

  telechips,dual-link:
    type: boolean
    description:
      Drive dual ports D0 (primary, lvds-cfg0) and D1 (secondary,
      lvds-cfg1), one pixel each per clock. Absent, single port S0 (lvds0).

  telechips,data-mapping:
    $ref: /schemas/types.yaml#/definitions/string
    enum: [vesa-24, jeida-24, jeida-18]
    default: vesa-24

  telechips,lane-select:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      PHY input feeding each output lane (CLK, DATA0..3) of the primary
      port, as 0 = CLK, 1..4 = DATA0..3. Board routing; defaults to
      identity.
    minItems: 5
    maxItems: 5
    items:
      maximum: 4

  telechips,secondary-lane-select:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: As telechips,lane-select, for the secondary port.
    minItems: 5
    maxItems: 5
    items:
      maximum: 4

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names

dependentRequired:
  telechips,phy-init: [telechips,vcm-millivolt, telechips,vsw-millivolt]
  telechips,secondary-lane-select: [telechips,dual-link]

additionalProperties: false

examples:
  - |
    lvds-phy@12370000 {
        compatible = "telechips,tcc803x-lvds";
        reg = <0x12370000 0x400>, <0x12370400 0x400>,
              <0x12360800 0x400>, <0x12360c00 0x400>;
        reg-names = "lvds0", "lvds1", "lvds-cfg0", "lvds-cfg1";
        clocks = <&ckc 105>;
        clock-names = "lvds-phy";

        port {
            lvds_phy_in: endpoint {
                remote-endpoint = <&vioc_crtc0_out>;
            };
        };
    };

...
