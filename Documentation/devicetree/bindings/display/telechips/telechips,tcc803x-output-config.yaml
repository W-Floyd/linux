%YAML 1.2
---
$id: http://devicetree.org/schemas/display/telechips/telechips,tcc803x-output-config.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x VIOC output-config (OUTCFG) block

maintainers:
  - William Floyd <git@notmy.space>

description: |
  Routing mux between the SoC's DISP0/DISP1/DISP2 timing-generator
  outputs and its physical output interfaces (HDMI, SD/HD video encoder,
  an MCU-style 8080 parallel panel interface, and a synchronous parallel
  RGB panel interface). Confirmed real and at this exact address by the
  vendor driver (AVNT5W_TCC803XKK_kernel):

    arch/arm/mach-tcc803x/vioc/vioc_outcfg.c: vioc_outputconfig_init()
    (arch_initcall) does
    of_find_compatible_node(NULL, NULL, "telechips,output_config")
    then of_iomap(np, 0) -- same compatible string and reg window as
    the pre-existing arch/arm/boot/dts/mobis/tcc803x.dtsi:2306-2309
    node this binding now documents formally.

  Register layout (include/video/tcc/vioc_outcfg.h, struct VIOC_OUTCFG,
  4 x 32-bit words = the 0x10 reg size):

    0x00  D0CPUIF   CPU/MCU-interface control for a panel driven
                     directly off DISP0 (bitfields: FMT, XA, CS, SI,
                     EN, IV, ID -- not decoded further here, only the
                     offset is confirmed real).
    0x04  D1CPUIF   Same, for DISP1.
    0x08  D2CPUIF   Same, for DISP2.
    0x0C  MISCCFG   Output-type routing mux, 5 x 2-bit SEL fields,
                     each selecting which DISP (0/1/2; 3 = reserved/
                     "V_DV") feeds that physical output type:
                       bits [1:0]   HDMISEL  (HDMI TX)
                       bits [5:4]   SDVESEL  (SD video encoder /
                                              composite)
                       bits [9:8]   HDVESEL  (HD video encoder /
                                              component)
                       bits [13:12] M80SEL   (MCU/8080 parallel
                                              interface)
                       bits [17:16] MRGBSEL  (synchronous parallel
                                              RGB interface)
                     Set by VIOC_OUTCFG_SetOutConfig(type, disp) in
                     vioc_outcfg.c, which does exactly this
                     read-modify-write (tcc_vioc_bitcset) per type;
                     bit positions above are taken directly from that
                     function's shift amounts (0, 4, 8, 12, 16), which
                     match the VIOC_OUTCFG_MISC bitfield struct in
                     vioc_outcfg.h.

  What still is NOT confirmed from static vendor source alone, and
  would need a live register read (not attempted here) or a board-init
  call site this tree doesn't have, to settle:

    - Which output type the real DISP0-fed main panel uses. HDMI,
      SDVENC and HDVENC are external video-format outputs, not
      appropriate for a directly-driven LCD; M80 is a command-mode MCU
      panel interface; MRGB is the standard synchronous parallel-RGB
      panel interface and is the only structurally-plausible fit for a
      conventional LCD panel among the five -- but VIOC_OUTCFG_MRGB is
      only ever *defined* in this vendor tree (include/video/tcc/
      vioc_outcfg.h:37 and duplicates), never passed to
      VIOC_OUTCFG_SetOutConfig() by any board/driver file found here.
      The only call site located (drivers/video/fbdev/tcc-fb/
      tcc_vioc_fb.c:1033) hardcodes VIOC_OUTCFG_HDMI for an external
      display path, not the main panel. It is possible the main panel
      needs no explicit SetOutConfig() call at all, if MISCCFG's
      power-on-reset value already selects DISP0 (SEL field value 0)
      for every output type -- plausible but not verified against a
      reset-value table in the extracted source.

      Follow-up (exhaustive grep of every VIOC_OUTCFG_SetOutConfig()
      caller in AVNT5W_TCC803XKK_kernel) confirms the above: MRGB (4)
      is never an argument anywhere in the tree; every call site passes
      HDMI, SDVENC or HDVENC. Structural counterpoint worth recording:
      the only other board in this same vendor tree with a comparable
      1920x720 panel (tianma TM123XDHP90, drivers/video/fbdev/tcc-fb/
      lcd_TM123XDHP90.c, "telechips,lvds-tm123xdhp90",
      arch/arm/boot/dts/tcc/tcc8030-android-lpd4321_sv0.1.dts:138-152)
      is LVDS off DISP0, not off DISP1 as earlier noted here -- that
      board's own file carries zero fbdisplay/DISP references; it
      `#include`s the real AVN board's own base dtsi,
      arch/arm/boot/dts/mobis/tcc8031-android-avn.dtsi, unmodified, and
      that dtsi's `fbdisplay@12000000` node sets
      `telechips,fbdisplay_num = <0>` (read directly as the DISP
      controller index -- `lcdc_number`/`nr_disp` -- by every consumer
      checked: drivers/video/fbdev/tcc-fb/tcc_vioc_fb.c:2526,
      drivers/gpu/drm/tcc/tcc_drm_lcd.c:787). So DISP0 is confirmed,
      independent of MRGB-vs-LVDS, for the main panel on this exact
      board family -- the earlier DISP1 attribution here conflated this
      with unrelated VIOC_DISP1 references in that same vendor tree's
      video/VIQE sub-pipeline nodes (PIP/overlay scaling paths, not the
      main panel). What remains genuinely unresolved is LVDS vs MRGB,
      not which DISP. The real AVN board file also names
      `lvds_variant_check-gpio` and `digital_variant_check-gpio` side
      by side in its `mobis-gpio-pinctrl` node
      (arch/arm/boot/dts/mobis/tcc8031-android-avn.dtsi:~890), implying
      two real production panel variants selected/detected at
      board/runtime level -- LVDS (via the SoC's on-die
      `lvds_phy@12370000`, clocked by `PERI_LVDS_PHY`, tcc803x.dtsi:
      2266-2271, with a complete working driver,
      lcd_TM123XDHP90.c) and a "digital" variant that is more likely
      DISP0's own native parallel-RGB pins driven directly (no
      MISCCFG/MRGBSEL involved at all) than the MISCCFG-routed MRGB aux
      path documented above, since that path has zero consumers
      anywhere in the vendor tree. See telechips,tcc803x-mrgb-panel.yaml
      for the MRGB panel node this mux feeds and its own caveat section
      on why MRGB routing here is grounded in a live register read
      (outside this static-source investigation), not vendor-source
      precedent. Resolving LVDS vs MRGB/digital for this specific unit
      needs either a live read of lvds_variant_check-gpio /
      digital_variant_check-gpio, or confirmation of whether DISP0's
      pixel stream reaches the panel through the lvds_phy block.
    - MISCCFG's live/current value on real hardware: not read here.
    - D0CPUIF/D1CPUIF/D2CPUIF bitfields beyond their offsets: not
      decoded, since no caller of VIOC_OUTCFG_SetOutConfig() in this
      vendor tree touches them (only MISCCFG is written by that
      function).

properties:
  compatible:
    const: telechips,output_config

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    output_config: output-config@12100200 {
        compatible = "telechips,output_config";
        reg = <0x12100200 0x10>;
    };
