%YAML 1.2
---
$id: http://devicetree.org/schemas/display/telechips/telechips,tcc803x-lvds-panel.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x AVN main panel, LVDS output

maintainers:
  - William Floyd <git@notmy.space>

description: |
  Same physical panel as telechips,tcc803x-mrgb-panel.yaml -- same
  board, same 1920x720 touch-coordinate-matched dimensions, same
  live-captured DISP0 timing (LHTIME1/2, LVTIME1/2, decoded through
  drivers/gpu/drm/telechips/tcc803x_drm_vioc.c's bitfield layout, which
  DISP0 generates and this output path passes through unmodified
  regardless of whether it leaves the SoC via MRGB pins or the on-die
  LVDS PHY). A separate compatible string instead of reusing
  "telechips,tcc803x-mrgb-panel" because the two describe genuinely
  different output stages (MISCCFG mux pins vs. lvds_phy serializer)
  even though the panel glass and timing are identical -- see
  telechips,tcc803x-mrgb-panel.yaml's description for the full
  LVDS-vs-MRGB evidence trail, which this binding does not repeat.

  clock-frequency is omitted from panel-timing for the same reason as
  the MRGB binding: the real pixel clock is an open question (live
  LCLKDIV reads PXCLKDIV=0, ACDIV=0, which does not resolve cleanly
  against the divider formula tcc803x_drm_vioc.c cites) independent of
  which output stage is used.

properties:
  compatible:
    const: telechips,tcc803x-lvds-panel

  width-mm:
    const: 92

  height-mm:
    const: 243

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description:
      Not connected in this board's DT and not referenced by
      drivers/gpu/drm/bridge/tcc803x-lvds.c, which is a terminal
      bridge (no drm_panel exists for this compatible string yet --
      see that driver's header). Present for schema completeness and
      so the real panel dimensions/timing have somewhere honest to
      live, same role mrgb_panel plays for the MRGB path.

  panel-timing:
    type: object
    properties:
      hactive:
        const: 1920
      vactive:
        const: 720
      hsync-len:
        const: 31
      hfront-porch:
        const: 49
      hback-porch:
        const: 159
      vsync-len:
        const: 4
      vfront-porch:
        const: 14
      vback-porch:
        const: 27
    required:
      - hactive
      - vactive
      - hsync-len
      - hfront-porch
      - hback-porch
      - vsync-len
      - vfront-porch
      - vback-porch
    additionalProperties: false

required:
  - compatible
  - panel-timing

additionalProperties: false

examples:
  - |
    panel {
        compatible = "telechips,tcc803x-lvds-panel";
        width-mm = <92>;
        height-mm = <243>;

        panel-timing {
            hactive = <1920>;
            vactive = <720>;
            hsync-len = <31>;
            hfront-porch = <49>;
            hback-porch = <159>;
            vsync-len = <4>;
            vfront-porch = <14>;
            vback-porch = <27>;
        };
    };

...
