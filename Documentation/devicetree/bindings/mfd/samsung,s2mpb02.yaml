%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/samsung,s2mpb02.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPB02 Power Management IC

maintainers:
  - William Floyd <git@notmy.space>

description:
  The S2MPB02 is a companion power management IC for the camera sensors in
  smart phones. It provides eighteen LDO regulators, two bucks and a
  buck-boost, along with a two-channel flash/torch LED controller. It is
  typically reached over a dedicated I2C bus rather than the main PMIC bus.

properties:
  compatible:
    const: samsung,s2mpb02

  reg:
    maxItems: 1

  regulators:
    type: object
    patternProperties:
      "^(ldo([1-9]|1[0-8])|buck[12]|bb)$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

        required:
          - regulator-name

    additionalProperties: false

  leds:
    type: object
    additionalProperties: false

    description:
      The two FLED channels. Each drives one LED with an independent
      current, mode and hardware timeout, and can be strobed either over
      I2C or through its own pair of FLASH_EN and TORCH_EN pins.

    properties:
      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

    patternProperties:
      "^led@[01]$":
        type: object
        $ref: /schemas/leds/common.yaml#
        unevaluatedProperties: false

        properties:
          reg:
            description: Index of the FLED channel.
            minimum: 0
            maximum: 1

          led-max-microamp:
            minimum: 20000
            maximum: 300000

          flash-max-microamp:
            minimum: 100000
            maximum: 1500000

          flash-max-timeout-us:
            minimum: 62500
            maximum: 1000000

        required:
          - reg

    required:
      - "#address-cells"
      - "#size-cells"

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@59 {
            compatible = "samsung,s2mpb02";
            reg = <0x59>;

            regulators {
                ldo5 {
                    regulator-name = "cam_vdig";
                    regulator-min-microvolt = <1050000>;
                    regulator-max-microvolt = <1050000>;
                };

                ldo6 {
                    regulator-name = "cam_vio";
                    regulator-min-microvolt = <1800000>;
                    regulator-max-microvolt = <1800000>;
                };

                ldo13 {
                    regulator-name = "cam_vana";
                    regulator-min-microvolt = <2800000>;
                    regulator-max-microvolt = <2800000>;
                };
            };

            leds {
                #address-cells = <1>;
                #size-cells = <0>;

                led@0 {
                    reg = <0>;
                    color = <LED_COLOR_ID_WHITE>;
                    function = LED_FUNCTION_FLASH;
                    led-max-microamp = <300000>;
                    flash-max-microamp = <1200000>;
                    flash-max-timeout-us = <500000>;
                };
            };
        };
    };

...
