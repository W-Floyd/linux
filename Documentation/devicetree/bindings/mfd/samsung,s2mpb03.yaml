%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/samsung,s2mpb03.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPB03 Power Management IC

maintainers:
  - William Floyd <git@notmy.space>

description:
  The S2MPB03 is a companion power management IC for the camera sensors in
  smart phones, providing seven LDO regulators. It is typically reached over
  a dedicated I2C bus rather than the main PMIC bus.

properties:
  compatible:
    const: samsung,s2mpb03

  reg:
    maxItems: 1

  regulators:
    type: object
    patternProperties:
      "^ldo[1-7]$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

        required:
          - regulator-name

    additionalProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@56 {
            compatible = "samsung,s2mpb03";
            reg = <0x56>;

            regulators {
                ldo1 {
                    regulator-name = "cam_vdig";
                    regulator-min-microvolt = <1000000>;
                    regulator-max-microvolt = <1000000>;
                };

                ldo3 {
                    regulator-name = "cam_vio";
                    regulator-min-microvolt = <1800000>;
                    regulator-max-microvolt = <1800000>;
                };

                ldo5 {
                    regulator-name = "cam_vana";
                    regulator-min-microvolt = <3200000>;
                    regulator-max-microvolt = <3200000>;
                };
            };
        };
    };

...
