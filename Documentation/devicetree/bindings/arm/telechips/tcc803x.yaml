%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/telechips/tcc803x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Telechips TCC803x SoC based Platforms

maintainers:
  - William Floyd <git@notmy.space>

description:
  Boards with a Telechips TCC803x SoC shall have the following properties.

properties:
  $nodename:
    const: '/'
  compatible:
    items:
      - enum:
          - telechips,tcc803x-avn # Telechips TCC803x AVN (Audio Video Navigation) reference board
      - const: telechips,tcc803x

additionalProperties: true

...
